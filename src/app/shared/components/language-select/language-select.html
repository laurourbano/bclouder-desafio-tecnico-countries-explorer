<mat-form-field appearance="outline">
  <mat-label>Language</mat-label>
  <mat-select [value]="langService.language()" (selectionChange)="langService.setLanguage($event.value)">
    @for (language of languages; track language.code) {
    <mat-option [value]="language.code">
      {{ language.label }}
    </mat-option>
    }
  </mat-select>
</mat-form-field>
