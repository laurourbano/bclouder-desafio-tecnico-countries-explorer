<mat-form-field appearance="outline">

  <mat-label>Language</mat-label>

  <mat-select
    [value]="langService.language()"
    (selectionChange)="langService.setLanguage($event.value)"
  >

    @for (lang of languages; track lang.code) {
      <mat-option [value]="lang.code">
        {{ lang.label }}
      </mat-option>
    }

  </mat-select>

</mat-form-field>
