<h2>Testando a Api</h2>

<button (click)="load()">
    Carregar países
</button>
<button (click)="clear()">
  Apagar lista
</button>
<div class="wrapper">
  @for(country of countries; track country.name.official) {
      <div>
        <img src="{{country.flags.png}}" alt="{{country.name.common}}">
          <span>
            {{ country.name.common }}
          </span>
      </div>
  }

</div>
